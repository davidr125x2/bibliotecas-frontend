<form class="tarjeta" [formGroup]="form" (ngSubmit)="registrar()" novalidate>
  <h2>Registrar biblioteca</h2>

  <label for="nombre">Nombre</label>
  <input id="nombre" type="text" formControlName="nombre">
  @if (invalido('nombre')) { <small class="error">El nombre es obligatorio.</small> }

  <label for="direccion">Dirección</label>
  <input id="direccion" type="text" formControlName="direccion">
  @if (invalido('direccion')) { <small class="error">La dirección es obligatoria.</small> }

  <label for="ciudad">Ciudad</label>
  <input id="ciudad" type="text" formControlName="ciudad">
  @if (invalido('ciudad')) { <small class="error">La ciudad es obligatoria.</small> }

  <button type="submit" [disabled]="guardando()">
    {{ guardando() ? 'Guardando…' : 'Registrar' }}
  </button>

  @if (mensaje()) { <p class="exito">{{ mensaje() }}</p> }
  @if (error()) { <p class="error">{{ error() }}</p> }
</form>
